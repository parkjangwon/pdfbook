name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Assemble release
        env:
          PDFBOOK_KEYSTORE: ${{ runner.temp }}/release.jks
          PDFBOOK_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          PDFBOOK_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          PDFBOOK_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PDFBOOK_VERSION_CODE: ${{ vars.PDFBOOK_VERSION_CODE }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PversionName="$VERSION" --console=plain
          cp app/build/outputs/apk/release/app-release.apk "pdfbook-${VERSION}.apk"
      - name: Upload GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "pdfbook-${VERSION}.apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
