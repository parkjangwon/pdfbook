name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|refactor|test|chore|ci|docs|perf|build|style|revert)(\([a-z0-9-]+\))?!?: .{1,72}$'
          fail=0

          check() {
            local label="$1" subject="$2" level="$3"
            if [[ ${#subject} -gt 72 ]] || ! [[ "$subject" =~ $PATTERN ]]; then
              echo "::$level::$label does not match Conventional Commits (<=72): $subject"
              if [[ "$level" == "error" ]]; then fail=1; fi
            else
              echo "ok $label: $subject"
            fi
          }

          check "PR title" "$PR_TITLE" error
          while IFS= read -r subject; do
            check "commit" "$subject" warning
          done < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")

          exit "$fail"

  linked-issue:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body links an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          PATTERN='(?i)\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#[0-9]+'
          if grep -Pq "$PATTERN" <<< "${PR_BODY:-}"; then
            echo "ok PR body links an issue"
          else
            echo "::error::PR 본문에 연결할 이슈가 없습니다. 본문에 'Closes #번호'(또는 Fixes #번호, Resolves #번호)를 넣어 주세요. 예: Closes #12"
            exit 1
          fi
