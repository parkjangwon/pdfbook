name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build, test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: Release version rules
        run: bash scripts/test-release-version.sh
